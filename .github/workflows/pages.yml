name: Verify and deploy Afiyah
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm test
      - run: node --check v2/app.js && node --check v2/data.js && node --test v2/tests/*.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --ignore-scripts firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.22.0
      - name: Verify access rules and concurrent dose recording
        run: npx firebase emulators:exec --only firestore --project demo-afiyah-v2 --config firebase.v2-test.json 'node --test v2/tests/rules.test.mjs'
      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html style.css app.js data.js config.js manifest.webmanifest public/
          cp -R assets public/
          mkdir -p public/v2
          cp v2/*.html v2/*.js v2/*.css public/v2/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
